<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DSN Overlay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<!--
  Compact Deep Space Network card for OBS (Browser Source).
  The page background is transparent, so OBS shows only the card.
  The card fills whatever size the Browser Source is set to:
    wide  (e.g. 480 x 270)  photo on the left, details on the right
    square (e.g. 360 x 360) photo on top, details below

  URL options:
    ?rotate=12   seconds per antenna (default 12)
    ?poll=10     seconds between feed refreshes (default 10)
    ?photo=0     hide the spacecraft photo
    ?ladder=0    hide the distance bar
    ?bg=0.85     card background opacity, 0 to 1 (default 0.85)
    ?lite        no continuous animation
    ?demo        bundled sample data
-->
<style>
:root{
  --space:15,24,48;     /* #0f1830 as rgb, so the card opacity can vary */
  --panel:#16213f;
  --rule:#26345c;
  --paper:#ebe6d8;
  --dim:#8b95b3;
  --down:#f2b544;
  --up:#5fd3c4;
  --bg:.85;
  --display:"Barlow Condensed","Arial Narrow",sans-serif;
  --body:"Atkinson Hyperlegible",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:transparent;overflow:hidden}
html{font-size:min(3.6vw,7.6vh)}
body{padding:.4rem;color:var(--paper);font-family:var(--body);font-variant-numeric:tabular-nums}

.card{position:relative;height:100%;display:grid;grid-template-rows:auto 1fr auto;gap:.55rem;
  padding:.8rem .95rem .75rem;border-radius:.8rem;overflow:hidden;
  background:rgba(var(--space),var(--bg));border:1px solid rgba(38,52,92,.9);
  box-shadow:0 .2rem .9rem rgba(0,0,0,.35)}

/* top line */
.top{display:flex;align-items:center;gap:.5rem;font-size:.72rem;color:var(--dim);white-space:nowrap}
.top b{font-family:var(--display);font-weight:600;font-size:1.25em;letter-spacing:.08em;color:var(--paper)}
.top .sum{margin-left:auto}
.dot{width:.5rem;height:.5rem;border-radius:50%;background:var(--up);flex:none}
.dot.stale{background:var(--down)} .dot.down{background:#e2614f}
.dot{animation:blink 2.4s ease-in-out infinite}
@keyframes blink{50%{opacity:.35}}

/* body: photo + details */
.body{display:grid;grid-template-columns:auto 1fr;gap:.8rem;align-items:center;min-height:0;transition:opacity .45s}
.body.out{opacity:0}
figure{height:100%;max-height:7.2rem;aspect-ratio:1/1;border-radius:.45rem;overflow:hidden;background:var(--panel);display:grid;place-items:center;min-height:0}
figure img{width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .6s}
figure img.on{opacity:1}
figure svg{width:55%;color:var(--rule)}
.nophoto .body{grid-template-columns:1fr} .nophoto figure{display:none}

.info{min-width:0}
.where{display:flex;align-items:center;gap:.35rem;font-size:.7rem;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.where svg{width:1.3rem;height:1.3rem;flex:none;overflow:visible;color:var(--paper)}
.where b{color:var(--paper);font-weight:700}
#craft{font-family:var(--display);font-weight:600;font-size:1.75rem;line-height:1;margin:.15rem 0 .4rem;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.stats{display:flex;gap:1rem;white-space:nowrap}
.stat dt{font-size:.58rem;color:var(--dim);text-transform:uppercase;letter-spacing:.06em}
.stat dd{font-family:var(--display);font-size:1.1rem;font-weight:500;line-height:1.1}
.stat dd small{font-size:.65em;color:var(--dim);margin-left:.12em;font-weight:400}
.stat.dn dd{color:var(--down)} .stat.upl dd{color:var(--up)}

/* dish icon waves (same drawing as the full display) */
.wave{opacity:0;transform-box:fill-box;transform-origin:center}
.rx .wave.dn{animation:wave 2.4s ease-out infinite}
.tx .wave.up{animation:wave 2.4s ease-out infinite 1.2s}
@keyframes wave{0%{opacity:.9;transform:scale(.6)}100%{opacity:0;transform:scale(1.6)}}

/* mini distance bar: Earth -> heliopause, log scale */
.ladder{position:relative;height:1.35rem}
.nol .ladder{display:none}
.ladder .track{position:absolute;left:0;right:0;top:.35rem;height:2px;background:var(--rule)}
.ladder .beam{position:absolute;left:0;top:.35rem;height:2px;background:linear-gradient(90deg,var(--down),rgba(242,181,68,.25));transition:width 1s ease}
.ladder .earth{position:absolute;left:0;top:calc(.35rem - 4px);width:10px;height:10px;border-radius:50%;background:#4f8de0}
.ladder .craft{position:absolute;top:calc(.35rem - 5px);width:12px;height:12px;transform:translateX(-50%);border:2px solid var(--down);border-radius:50%;background:rgb(var(--space));transition:left 1s ease}
.ladder .mark{position:absolute;top:.2rem;transform:translateX(-50%);font-size:.5rem;color:var(--dim);white-space:nowrap}
.ladder .mark::before{content:"";display:block;width:1px;height:.35rem;margin:0 auto .15rem;background:var(--dim);opacity:.6}
.ladder .pulse{position:absolute;top:calc(.35rem - 2px);width:6px;height:6px;border-radius:50%;background:var(--down);box-shadow:0 0 6px var(--down);animation:travel var(--t,4s) linear infinite}
@keyframes travel{from{left:var(--to,100%);opacity:1}to{left:0;opacity:.2}}

/* rotation progress + position */
.foot{display:flex;align-items:center;gap:.5rem}
.dots{display:flex;gap:.28rem}
.dots i{width:.32rem;height:.32rem;border-radius:50%;background:var(--rule)}
.dots i.on{background:var(--paper)}
.timer{position:absolute;left:0;bottom:0;height:2px;background:var(--up);opacity:.55;width:0}
.timer.run{width:100%;transition:width var(--rot,12s) linear}

.quiet{font-size:.8rem;color:var(--dim);line-height:1.4}

/* square or tall sources: photo on top */
@media (max-aspect-ratio:13/10){
  html{font-size:min(5.6vw,4.6vh)}
  .body{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) auto;align-items:stretch;gap:.6rem}
  figure{width:100%;height:100%;max-height:none;aspect-ratio:auto}
  .top .sum{font-size:.95em}
}

.lite .pulse,.lite .wave,.lite .dot{animation:none!important}
.lite .rx .wave.dn,.lite .tx .wave.up{opacity:.7;transform:none}
@media (prefers-reduced-motion:reduce){.pulse,.wave,.dot{animation:none!important}}
</style>
</head>
<body>
<div class="card">
  <div class="top"><i class="dot" id="dot"></i><b>DEEP SPACE NETWORK</b><span class="sum" id="sum">Connecting…</span></div>
  <div class="body" id="body">
    <figure><img id="img" alt=""><svg id="ph" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2"><rect x="24" y="24" width="16" height="16" rx="2"/><path d="M24 32H6M40 32h18M10 26v12M54 26v12M32 24V12m-6 0a6 6 0 0 0 12 0z"/></svg></figure>
    <div class="info">
      <p class="where" id="where"></p>
      <h2 id="craft">Listening…</h2>
      <dl class="stats" id="stats"></dl>
    </div>
  </div>
  <div>
    <div class="ladder" id="ladder"></div>
    <div class="foot"><div class="dots" id="dots"></div></div>
  </div>
  <div class="timer" id="timer"></div>
</div>

<script src="dsn-core.js"></script>
<script>
const ROTATE = (+P.get('rotate') || 12) * 1000;
const POLL = (+P.get('poll') || 10) * 1000;
const root = document.documentElement;
if (P.get('photo') === '0') root.classList.add('nophoto');
if (P.get('ladder') === '0') root.classList.add('nol');
if (P.has('bg')) root.style.setProperty('--bg', Math.max(0, Math.min(1, +P.get('bg') || 0)));
root.style.setProperty('--rot', ROTATE/1000 + 's');

let items = [], idx = 0;

function stat(cls, label, val){ return `<div class="stat ${cls}"><dt>${label}</dt><dd>${val}</dd></div>`; }

function renderNumbers(it){
  const dist = fmtDist(it.range), light = fmtLight(it.rtlt ? it.rtlt/2 : null);
  const dr = it.dn && fmtRate(it.dn.rate), ur = it.up && fmtRate(it.up.rate);
  // only show what's known, so the line stays short
  const parts = [];
  if (it.range) parts.push(stat('', 'Distance', html(...dist)));
  if (it.rtlt) parts.push(stat('', 'Light time', html(...light)));
  if (it.dn) parts.push(stat('dn', 'Down', dr ? html(...dr) : 'Carrier'));
  if (it.up && parts.length < 3) parts.push(stat('upl', 'Up', ur ? html(...ur) : 'Carrier'));
  $('stats').innerHTML = parts.join('');

  const p = it.range ? pos(it.range) : 0;
  const t = it.rtlt ? Math.max(1.5, Math.min(9, 1 + Math.log10(it.rtlt+1)*1.6)) : 4;
  $('ladder').innerHTML = `<div class="track"></div><div class="beam" style="width:${p}%"></div>
    ${it.range ? `<div class="pulse" style="--to:${p}%;--t:${t}s"></div>` : ''}
    <div class="earth"></div>
    ${MARKS.filter(([n]) => n !== 'Neptune').map(([n,k]) => `<div class="mark" style="left:${pos(k)}%${n==='Heliopause'?';transform:translateX(-85%)':''}">${n}</div>`).join('')}
    ${it.range ? `<div class="craft" style="left:${p}%"></div>` : ''}`;
}

function restartTimer(){
  const t = $('timer');
  t.classList.remove('run'); void t.offsetWidth;
  if (items.length > 1) t.classList.add('run');
}

async function show(){
  const body = $('body');
  if (!items.length){
    $('where').textContent = '';
    $('craft').textContent = 'All dishes quiet';
    $('stats').innerHTML = '<p class="quiet">No spacecraft are talking to the network right now.</p>';
    $('ladder').innerHTML = ''; $('dots').innerHTML = '';
    $('img').classList.remove('on'); $('ph').style.display = '';
    return;
  }
  body.classList.add('out');
  await new Promise(r => setTimeout(r, 450));
  idx %= items.length;
  const it = items[idx], d = it.dish, s = SITES[d.site];
  const rx = !!it.dn, tx = !!it.up;
  $('where').innerHTML = `<span class="${rx?'rx':''} ${tx?'tx':''}">${dishSvg(d.el)}</span>`
    + `<span><b>${s.name}</b> · ${d.name.replace('DSS','DSS ')} · ${d.big?'70':'34'} m</span>`;
  $('craft').textContent = craftName(it.craft);
  renderNumbers(it);
  $('dots').innerHTML = items.length > 1 ? items.map((_,i) => `<i class="${i===idx?'on':''}"></i>`).join('') : '';
  const img = $('img');
  img.classList.remove('on'); $('ph').style.display = '';
  body.classList.remove('out');
  restartTimer();

  if (root.classList.contains('nophoto')) return;
  const w = await wiki(wikiTitle(it.craft));
  if (items[idx] !== it) return;
  const src = imgUrl(w && w.thumbnail && w.thumbnail.source, false);   // the default thumb is plenty at this size
  if (src){
    img.onload = () => { if (items[idx] === it){ img.classList.add('on'); $('ph').style.display = 'none'; } };
    img.onerror = () => { $('ph').style.display = ''; };
    img.src = src;
  }
}

async function poll(){
  const dot = $('dot');
  try {
    const r = await fetch(DEMO ? 'sample-dsn.xml' : 'api/dsn', {cache:'no-store'});
    if (!r.ok) throw new Error(r.status);
    const sites = parse(await r.text());
    dot.className = 'dot' + (r.headers.get('X-Stale') ? ' stale' : '');
    const prev = items[idx];
    items = spotlights(sites);
    const n = new Set(items.map(i=>i.craft)).size;
    const dishes = new Set(items.map(i=>i.dish.name)).size;
    $('sum').textContent = `${n} craft · ${dishes} dishes`;
    // keep the current antenna steady across refreshes, just update its numbers
    const keep = prev ? items.findIndex(i => i.dish.name===prev.dish.name && i.craft===prev.craft) : -1;
    if (keep >= 0){ idx = keep; renderNumbers(items[idx]); }
    else { idx = 0; show(); }
  } catch(e){
    dot.className = 'dot down';
    if (!items.length) $('sum').textContent = 'Feed offline';
  }
}

loadConfig().then(poll);
setInterval(poll, POLL);
setInterval(() => { if (items.length > 1){ idx = (idx+1) % items.length; show(); } }, ROTATE);
setTimeout(() => location.reload(), 24*3600*1000);
</script>
</body>
</html>
